plugins {
    id 'dev.kikugie.loom-back-compat'
}

def modern = sc.current.parsed >= '26.1'
def javaVersion = modern ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
def javaLevel = modern ? '25' : '21'

version = "${property('mod.version')}+${sc.current.version}"
group = property('mod.group')

base {
    archivesName = 'combat-hitbox+'
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"
    if (!modern) {
        mappings loom.officialMojangMappings()
    }
    add('modImplementation', "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}")
    add('modImplementation', "net.fabricmc.fabric-api:fabric-api:${sc.properties.raw('deps', 'fabric_api')}")
    add('modImplementation', "com.terraformersmc:modmenu:${sc.properties.raw('deps', 'modmenu')}")
    add('modImplementation', "me.shedaniel.cloth:cloth-config-fabric:${sc.properties.raw('deps', 'cloth_config')}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        client {
            client()
        }
    }
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain {
        languageVersion = JavaLanguageVersion.of(modern ? 25 : 21)
    }
}

processResources {
    def currentVersion = sc.current.version.toString()
    def mixinEntries = []
    if (currentVersion == '1.21.11' || modern) {
        mixinEntries << 'HitBoxRenderMixin'
    } else {
        mixinEntries << 'LineSizeMixin'
    }
    if (currentVersion in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4']) {
        mixinEntries << 'LegacyDispatcherMixin'
    }
    if (currentVersion in ['1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10']) {
        mixinEntries << 'StateHitBoxMixin'
        mixinEntries << 'EntityRenderStateMixin'
        mixinEntries << 'EntityRendererMixin'
    }
    mixinEntries << 'StuckArrowMixin'
    mixinEntries << 'StuckStingerMixin'
    def props = [
            'version'  : project.property('mod.version').toString(),
            'mc_compat': sc.properties.raw('mod', 'mc_compat').toString(),
            'java'     : javaLevel,
            'mixins'   : mixinEntries.collect { "\"${it}\"" }.join(',\n    ')
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
    filesMatching('*.mixins.json') {
        expand(props)
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
